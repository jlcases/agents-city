# Lint for the Python half of this repo. The rules are chosen, not inherited, and
# every exemption below says why it exists — an unexplained ignore is how a rule
# dies in its sleep.
[tool.ruff]
line-length = 100
target-version = "py311"
# Extensionless entry points are listed too, and a contract keeps that list
# honest. `bin/hall` is Python with no `.py` on it, so a glob on the extension
# never linted it — and shipped a call to a module it had forgotten to import.
# That is the third time in this repo that a tool chose files by their NAME
# instead of by what they are.
include = [
  "bin/*.py", "plugin/scripts/*.py", "plugin/hooks/*.py", "city/scripts/*.py",
  "demo/*.py",
  "benchmarks/**/*.py", "city/oven/*.py", "city/web/*.py",
  "bin/hall",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, B bugbear (the one that catches real bites:
# loop-variable closures, mutable defaults), C901 the god-function gate.
select = ["E", "F", "W", "B", "C901"]
ignore = [
  # One-letter loop vars over lines of text (`for l in ...`) are this codebase's
  # idiom and read fine next to their one-line bodies.
  "E741",
  # Module import not at top: every entry point does `sys.path.insert` before
  # importing the shared modules, because the shared folder is what ships and the
  # scripts must find it from a clone AND from an installed plugin. The pattern is
  # the architecture, not an accident.
  "E402",
  # `noqa`-style deliberate lambdas remain case by case, not wholesale.
]

[tool.ruff.lint.mccabe]
# The god-function gate. Event loops are exempted per file below — a curses key
# handler IS a switch, and splitting a switch across functions hides its shape.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Most of this file is prose addressed to a model, not code: three notices whose
# paragraphs are the product. Wrapping them would put newlines inside the text a
# reader receives, so the paragraph stays one line and the ruler does not apply.
"plugin/hooks/hook.py" = ["E501"]
# The two benchmark runners are scripts: one long sequence of steps against a
# live system, where every step is a state the next one depends on. Splitting
# that into functions to satisfy a counter hides the order, which IS the thing
# being read. They were never linted at all until a contract noticed.
"benchmarks/latency/live.py" = ["C901"]
"benchmarks/stress/run.py" = ["C901"]
# ui.py holds the terminal widgets: each is one curses event loop whose branches
# are keystrokes. Their complexity is the domain's, not the code's.
"plugin/scripts/ui.py" = ["C901"]
