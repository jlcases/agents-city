[package]
name = "agents-city-hybrid-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
agents-city-hybrid-crypto = { path = "..", features = ["fuzzing"] }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "hybrid_raw"
path = "fuzz_targets/hybrid_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hybrid_roundtrip"
path = "fuzz_targets/hybrid_roundtrip.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
