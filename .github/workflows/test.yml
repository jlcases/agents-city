# Every check, on every push. The suites are the product's memory of its own
# bugs — the reporter that never worked, the field no writer wrote, the two
# resolvers that disagreed — and a memory nobody consults on push is decoration.
name: test
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
  # A release calls this before it publishes. Nothing goes to the registry that
  # these three runners have not agreed on first.
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      # The packaged Connect client deliberately resolves the OS keyring from
      # the root package, exactly as an installed `agents-city` copy does.
      - name: install package runtime dependencies
        run: npm ci --silent
      # tmux for the seat's options suite; bubblewrap because the Linux cage IS
      # bubblewrap, and a cage suite that skips proves nothing.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux bubblewrap
      # Ubuntu 24 ships with unprivileged user namespaces restricted by AppArmor,
      # which is exactly the case cage.py probes for — and a runner that cannot
      # build one tests the cage's fallback instead of the cage. Turn it on here
      # so CI exercises what a normal Linux desktop gives an owner.
      - name: allow the unprivileged namespaces the Linux cage is made of
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --ro-bind / / --dev /dev true && echo "bubblewrap can build a namespace here"
      # A source checkout has no node_modules. The protocol doubles and browser
      # spectator tests resolve `ws` from this package before the later typecheck.
      - name: install local channel dependencies for the integration suites
        run: npm --prefix plugin/channel ci --silent
      # What is committed has to BE what a publish would ship.
      #
      # `prepublishOnly` rebuilds these bundles, so the tarball on the registry
      # is whatever that rebuild produces — not what anybody reviewed. They had
      # already drifted apart, silently, because the suites check the artifacts
      # for markers and markers survive a different build. This compares bytes.
      - name: the committed bundles are the ones a publish would build
        run: |
          npm --prefix plugin/channel run build >/dev/null
          git diff --exit-code -- plugin/channel/'*.js' || {
            echo "::error::the committed channel bundles are not what the build produces."
            echo "Run: npm --prefix plugin/channel ci && npm --prefix plugin/channel run build"
            exit 1
          }
      # Installed BEFORE the suites: the browser suite rebuilds the Hall bundle
      # so it drives the current source rather than a committed one that may be
      # a commit behind.
      - name: install the front end's build tools
        run: npm --prefix city/web ci --silent
      - name: all suites, both compatibility walks, and the package check
        # The runner ships Chrome; REQUIRED makes a runner that lost it fail
        # loudly instead of quietly skipping the only checks that click.
        env:
          CITY_BROWSER_REQUIRED: '1'
          # Same idea for the cage: this runner installs bubblewrap, so a run
          # where the live namespace checks skip is a run that tested nothing.
          CITY_CAGE_REQUIRED: '1'
          # And the window server: this runner installs tmux, so a run where the
          # live multiplexer checks skip is a run that tested a table and called
          # it a seam.
          CITY_MUX_REQUIRED: '1'
        run: ./bin/test
      - name: the typed front ends hold under tsc --strict
        run: cd city/web && npm run typecheck
      - name: the worker holds under tsc --strict too
        run: cd city/worker && npm ci --silent && npm run typecheck
      - name: the remote road relay holds its typed envelope and durable queue
        run: cd bus/worker && npm ci --silent && npm run typecheck && npm run test:local
      - name: python lint — bugbear, style, and the god-function gate (C901 ≤ 12)
        run: pip install --quiet ruff && ruff check bin plugin/scripts plugin/hooks city/scripts demo benchmarks
      # Found, not listed. The hand-written list broke the day plugin/hooks
      # stopped containing shell — its glob matched nothing — and it had been
      # quietly missing seven scripts, bin/seat among them. Same rule as the
      # commit gate: ask git what is tracked, and read the shebang.
      - name: shell lint
        run: |
          GUIONES=()
          while IFS= read -r f; do
            case "$f" in
              *.sh) GUIONES+=("$f"); continue ;;
              *.py|*.ts|*.js|*.json|*.md|*.yml|*.html|*.css) continue ;;
            esac
            [ -f "$f" ] || continue
            case "$(head -c 60 "$f")" in
              '#!'*bash*|'#!'*/sh*) GUIONES+=("$f") ;;
            esac
          done < <(git ls-files)
          printf '  %s\n' "${GUIONES[@]}"
          shellcheck -S warning "${GUIONES[@]}"
      - name: prettier holds on every TypeScript file
        run: npx --yes prettier --check 'city/web/src/*.ts' 'city/worker/src/*.ts' 'plugin/channel/**/*.ts' 'bus/worker/src/*.ts' 'bus/scripts/*.ts'
      # The four runtime bundles are committed so the plugin runs with no build
      # step; the honest assertion here is that their sources still compile — bundles are not
      # byte-stable across esbuild versions, so a diff would lie. Nothing silenced:
      # the first version of this step swallowed npm's stderr and failed unreadably,
      # which is the exact sin the rest of this repo exists to catch.
      - name: the channel's source still compiles
        run: |
          cd plugin/channel
          npm ci
          npm run typecheck
          npm run build

  # Windows is most of the desktops there are, and this product refused to
  # install on all of them. That is being closed, and this job is what makes the
  # closing real rather than hopeful: every piece claimed to run there is run
  # here, on a machine with no bash, no tmux and no POSIX shell.
  #
  # What is NOT here is as deliberate: opening a city needs a window server, and
  # there is none on this runner. A green tick that covered it would mean
  # nothing.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      # Written down rather than assumed. `python3` is the POSIX spelling and a
      # Windows install from python.org gives `python` and `py`; which of them
      # this runner has decides what the front door may spell.
      - name: what this machine actually calls things
        shell: pwsh
        run: |
          foreach ($n in 'python','python3','py','node','git','tmux','bash') {
            $c = Get-Command $n -ErrorAction SilentlyContinue
            if ($c) { "  $n -> $($c.Source)" } else { "  $n -> ABSENT" }
          }
      # The disk scanner is here on purpose: it used to be a bash script, so on
      # Windows there was simply no way to find a repository. It is Python now.
      - name: the modules a Windows machine runs
        run: |
          python bin/test-card.py
          python bin/test-workspace.py
          python bin/test-atajos.py
          python bin/test-domains.py
          python bin/test-busca.py
          python bin/test-multiplexor.py
          python bin/test-launch.py
          python bin/test-hooks.py
          python bin/test-cities.py
      # The front door itself. Fifteen commands stopped being bash doors, and
      # what proves it is running them here rather than reading the map.
      - name: the npm front door dispatches without a shell
        shell: pwsh
        run: |
          node bin/agents-city.js --version
          node bin/agents-city.js --help
          node bin/agents-city.js doctor
          node bin/agents-city.js cities list
          if ($LASTEXITCODE -ne 0) { throw "a Python command failed on Windows" }
      # The conscience, invoked exactly as Claude Code invokes it — through
      # cmd.exe, with the one command string that has to work in two shells.
      # `python3` is not a name on a Windows install from python.org, and the
      # `|| python` half is what makes the same line run here.
      - name: the hooks answer through cmd.exe
        shell: pwsh
        run: |
          $raiz = Join-Path $PWD 'plugin'
          $env:CLAUDE_PLUGIN_ROOT = $raiz
          $hooks = Get-Content plugin/hooks/hooks.json -Raw | ConvertFrom-Json
          $orden = $hooks.hooks.UserPromptSubmit[1].hooks[0].command
          $orden = $orden.Replace('${CLAUDE_PLUGIN_ROOT}', $raiz)
          "command: $orden"
          $salida = & cmd /c "echo {} | $orden" 2>&1 | Out-String
          "answer: $salida"
          if ($salida.Trim() -ne '{}') { throw "the hook did not answer {}" }
          # And the half that makes it portable really is the one that ran: the
          # POSIX spelling has to fail here for the second to be reached.
          $primera = & cmd /c "python3 --version" 2>&1 | Out-String
          "python3 on this machine: $primera"

      # Exploratory, and allowed to fail: the one thing a city still cannot do
      # on Windows is open, because opening a city needs a window server and
      # tmux has none here. herdr does. What this asks is whether it installs
      # and answers on a headless runner at all — a driver written against a
      # binary nobody has run is a promise, not a feature.
      # The window server this product uses where tmux does not exist. Not a
      # probe any more: herdr is installed, its headless server started, and the
      # multiplexer suite runs its LIVE section against it — the same checks the
      # Linux runner runs against tmux, including the one about a neighbour
      # whose name starts the same.
      - name: a real window server, and the seam driving it
        shell: pwsh
        run: |
          irm https://herdr.dev/install.ps1 | iex
          $env:PATH = "$env:USERPROFILE\.herdr\bin;$env:LOCALAPPDATA\herdr\bin;$env:PATH"
          herdr --version
          $srv = Start-Process -FilePath herdr -ArgumentList 'server' -PassThru `
                   -RedirectStandardOutput herdr-server.out `
                   -RedirectStandardError herdr-server.err
          Start-Sleep -Seconds 5
          herdr status server
          # What a pane says about itself, printed once: the driver reads a
          # command name out of this and the field is the backend's business.
          herdr workspace create --cwd $env:TEMP --label shape --no-focus
          herdr pane list
          herdr pane process-info --pane w1:p1
          $env:AGENTS_CITY_MUX = 'herdr'
          $env:CITY_MUX_REQUIRED = '1'
          python bin/test-multiplexor.py
          $codigo = $LASTEXITCODE
          Get-Content herdr-server.out, herdr-server.err -ErrorAction SilentlyContinue
          herdr server stop 2>&1 | Out-String
          exit $codigo

      # And a command that is still a shell program says so, by name, instead of
      # the product claiming it does not run here at all.
      - name: a shell-only command refuses with the reason
        shell: pwsh
        run: |
          $salida = node bin/agents-city.js hall 2>&1 | Out-String
          $codigo = $LASTEXITCODE
          $salida
          if ($codigo -eq 0) { throw "hall should refuse on Windows, not pretend" }
          if ($salida -notmatch 'WSL') { throw "the refusal must say what to do" }
          # The refusal IS the pass, so the step must not inherit its exit code:
          # pwsh steps end on $LASTEXITCODE, and this one is 1 on purpose.
          exit 0

  # The cage is a macOS seatbelt profile checked against the live kernel, and
  # the broker guards what the cage seals. Linux cannot exercise either, so the
  # security suites get the one runner where they mean something.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: brew install tmux shellcheck 2>/dev/null || true
      - name: install local channel dependencies
        run: npm --prefix plugin/channel ci --silent
      - name: the security suites against the real kernel
        env: {CITY_MUX_REQUIRED: '1'}
        run: ./bin/test cage broker security workspace multiplexor
